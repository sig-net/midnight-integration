# Unit and integration testing.
#   unit         scripts/verify.sh (format + compile + signet-responder's
#                MinoCrab crate: fmt + clippy + parity tests against compactc
#                + zk keys + its zk bundle + lint + build + test), in two
#                calls around the zk-key cache restore
#   rust         the signet-midnight-serde crate: fmt + clippy + cargo test
#                against the COMMITTED conformance corpus (no Node, no compactc)
#   integration  compose stack + signet-caller e2e, whose setup deploys the
#                contracts and starts the fakenet responder
#
# Everything is FROZEN: npm deps from the committed yarn.lock (installs run
# --immutable), and the compact toolchain pinned by exact URL (launcher
# compact-v0.5.3, compiler compactc 0.36.0). Bump versions deliberately.
#
# Caches (compact-*, zk-keys-*) are keyed on those pins, and the cargo-*
# caches on a crate's Cargo.lock and rust-toolchain.toml, so a hit only skips
# a download/build/keygen and never changes what is built. Only the integration job
# saves zk-keys, while the unit job restores read-only. It also pulls the
# public ghcr.io/sig-net/fakenet image.

name: ci

on:
  push:
    branches: [main]
    # Prose and diagrams: nothing in compile, lint, build or test reads them.
    paths-ignore:
      - "**/*.md"
      - "**/*.drawio"
      - "**/*.drawio.png"
  pull_request:
    # Prose and diagrams: nothing in compile, lint, build or test reads them.
    paths-ignore:
      - "**/*.md"
      - "**/*.drawio"
      - "**/*.drawio.png"
  schedule:
    - cron: "17 3 * * *" # nightly: integration suite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: format → compile (skip-zk) → lint → build → unit tests
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect serde package changes
        id: serde
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash packages/midnight-serde-conformance/ci-changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # corepack owns yarn: the action's yarn-1 cache probe would die here
          package-manager-cache: false
      - name: Enable corepack (yarn 4 via the packageManager field)
        run: corepack enable
      - name: Restore the compact toolchain (keyed on the pinned versions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.compact
            ~/.local/bin/compact
          key: compact-${{ runner.os }}-launcher0.5.3-compactc0.36.0
      - name: Install the compact toolchain (pinned launcher + compiler, per AGENTS.md)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          # Launcher pinned to compact-v0.5.3 (never releases/latest).
          if ! command -v compact >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -LsSf --retry 4 -o /tmp/compact-installer.sh \
              https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.3/compact-installer.sh
            echo "5ad9c8f53dd09c39ebd4290dc47d1742d36b01ad65859eed41e7658ac65bdff8  /tmp/compact-installer.sh" | sha256sum -c
            sh /tmp/compact-installer.sh
          fi
          # compactc 0.36.0, fetched by exact URL and checksum, then adopted by
          # the launcher. Part of the ledger-9 matched set (see
          # docker-compose.yaml). Bump it with the npm stack.
          COMPACTC_DIR="$HOME/.compact/versions/0.36.0/x86_64-unknown-linux-musl"
          if [ ! -x "$COMPACTC_DIR/compactc" ]; then
            mkdir -p "$COMPACTC_DIR"
            curl -fsSL --retry 4 -o /tmp/compactc.zip \
              https://github.com/LFDT-Minokawa/compact/releases/download/compactc-v0.36.0/compactc_v0.36.0_x86_64-unknown-linux-musl.zip
            echo "7017b6121ebb9d53a562984bca616d143ef84fc7ee18b4da6c3a0a6615cb5e97  /tmp/compactc.zip" | sha256sum -c
            unzip -qo /tmp/compactc.zip -d "$COMPACTC_DIR"
            chmod +x "$COMPACTC_DIR"/*
          fi
          # Adopt the on-disk version. If the launcher refuses, wire its symlinks.
          compact update 0.36.0 || ln -sfn "$COMPACTC_DIR"/* "$HOME/.compact/bin/"
          compact compile --version
      - name: Read the compact compiler version (part of the zk cache key)
        id: compact
        run: |
          # The zk-key cache must bust on any compiler bump. The version directory
          # name is the exact pin, whatever `compact compile --version` prints.
          target="$(readlink -f "$(command -v compactc)")"
          version="$(basename "$(dirname "$(dirname "$target")")")"
          case "$version" in [0-9]*) ;; *) version="$(compact compile --version)" ;; esac
          echo "version=$(printf '%s' "$version" | tr -cd '[:alnum:]._-')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (frozen, from the committed yarn.lock)
        run: yarn install --immutable
      - name: Cache signet-responder's cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/signet-responder/minocrab/target
          key: cargo-signet-responder-${{ runner.os }}-${{ hashFiles('packages/signet-responder/minocrab/Cargo.lock', 'packages/signet-responder/minocrab/rust-toolchain.toml') }}
      - name: Format check, compile (skip-zk), signet-responder MinoCrab crate (fmt, clippy, parity tests against compactc)
        run: scripts/verify.sh skip-zk
      - name: Restore prebuilt zk proving keys (read-only, the integration job saves)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/signet-contract/src/managed
            packages/test-caller-contract/src/managed
          key: zk-keys-${{ runner.os }}-${{ steps.compact.outputs.version }}-${{ hashFiles('packages/*/src/*.compact', '!packages/signet-responder/src/*.compact') }}
      - name: zk keys (cache miss only), signet-responder zk bundle, lint, build, unit tests
        run: scripts/verify.sh zk
      - name: Compiler-backed Borsh response sweep
        if: steps.serde.outputs.changed == 'true'
        run: yarn workspace @midnight-integration/midnight-serde-conformance test:sweep

  rust:
    name: rust (fmt → clippy → test against the committed corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/midnight-serde-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      # (with rustfmt + clippy) on first use.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/midnight-serde-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/midnight-serde-rs/Cargo.lock', 'packages/midnight-serde-rs/rust-toolchain.toml') }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests (Borsh compatibility corpus and native types, frozen deps)
        run: cargo test --locked

  integration:
    name: integration (compose stack + fakenet + signet-caller e2e)
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # corepack owns yarn: the action's yarn-1 cache probe would die here
          package-manager-cache: false
      - name: Enable corepack (yarn 4 via the packageManager field)
        run: corepack enable
      - name: Restore the compact toolchain (keyed on the pinned versions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.compact
            ~/.local/bin/compact
          key: compact-${{ runner.os }}-launcher0.5.3-compactc0.36.0
      - name: Install the compact toolchain (pinned launcher + compiler, per AGENTS.md)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          # Launcher pinned to compact-v0.5.3 (never releases/latest).
          if ! command -v compact >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -LsSf --retry 4 -o /tmp/compact-installer.sh \
              https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.3/compact-installer.sh
            echo "5ad9c8f53dd09c39ebd4290dc47d1742d36b01ad65859eed41e7658ac65bdff8  /tmp/compact-installer.sh" | sha256sum -c
            sh /tmp/compact-installer.sh
          fi
          # compactc 0.36.0, fetched by exact URL and checksum, then adopted by
          # the launcher. Part of the ledger-9 matched set (see
          # docker-compose.yaml). Bump it with the npm stack.
          COMPACTC_DIR="$HOME/.compact/versions/0.36.0/x86_64-unknown-linux-musl"
          if [ ! -x "$COMPACTC_DIR/compactc" ]; then
            mkdir -p "$COMPACTC_DIR"
            curl -fsSL --retry 4 -o /tmp/compactc.zip \
              https://github.com/LFDT-Minokawa/compact/releases/download/compactc-v0.36.0/compactc_v0.36.0_x86_64-unknown-linux-musl.zip
            echo "7017b6121ebb9d53a562984bca616d143ef84fc7ee18b4da6c3a0a6615cb5e97  /tmp/compactc.zip" | sha256sum -c
            unzip -qo /tmp/compactc.zip -d "$COMPACTC_DIR"
            chmod +x "$COMPACTC_DIR"/*
          fi
          # Adopt the on-disk version. If the launcher refuses, wire its symlinks.
          compact update 0.36.0 || ln -sfn "$COMPACTC_DIR"/* "$HOME/.compact/bin/"
          compact compile --version
      - name: Read the compact compiler version (part of the zk cache key)
        id: compact
        run: |
          # The zk-key cache must bust on any compiler bump. The version directory
          # name is the exact pin, whatever `compact compile --version` prints.
          target="$(readlink -f "$(command -v compactc)")"
          version="$(basename "$(dirname "$(dirname "$target")")")"
          case "$version" in [0-9]*) ;; *) version="$(compact compile --version)" ;; esac
          echo "version=$(printf '%s' "$version" | tr -cd '[:alnum:]._-')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (frozen, from the committed yarn.lock)
        run: yarn install --immutable
      - name: Compile (skip-zk)
        run: yarn compile
      - name: Restore prebuilt zk proving keys
        id: zk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/signet-contract/src/managed
            packages/test-caller-contract/src/managed
          key: zk-keys-${{ runner.os }}-${{ steps.compact.outputs.version }}-${{ hashFiles('packages/*/src/*.compact', '!packages/signet-responder/src/*.compact') }}
      # The responder's bundle is never in the zk cache: `yarn compile:zk`
      # builds it on a miss, and on a hit the suite's setup builds it.
      - name: Cache signet-responder's cargo registry and build output (its zk bundle)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/signet-responder/minocrab/target
          # Its own key: this job builds only the binary, and sharing the unit
          # job's key would let it save a cache without the test and clippy builds.
          key: cargo-signet-responder-zk-${{ runner.os }}-${{ hashFiles('packages/signet-responder/minocrab/Cargo.lock', 'packages/signet-responder/minocrab/rust-toolchain.toml') }}
      - name: zk keygen (every contract, cache miss only)
        if: steps.zk.outputs.cache-hit != 'true'
        run: yarn compile:zk
      - name: Save zk proving keys (immediately, before a later failure can lose them)
        if: steps.zk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/signet-contract/src/managed
            packages/test-caller-contract/src/managed
          key: zk-keys-${{ runner.os }}-${{ steps.compact.outputs.version }}-${{ hashFiles('packages/*/src/*.compact', '!packages/signet-responder/src/*.compact') }}
      - name: Start the local stack (midnight node, indexer, proof server, anvil)
        run: docker compose up -d
      - name: Wait for the stack
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:9944/health >/dev/null 2>&1; do sleep 3; done'
          timeout 60 bash -c 'until curl -s -o /dev/null http://127.0.0.1:6300; do sleep 3; done'
          timeout 180 bash -c 'until curl -fs -X POST -H "content-type: application/json" -d "{\"query\":\"{__typename}\"}" http://127.0.0.1:8088/api/v4/graphql >/dev/null 2>&1; do sleep 3; done'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545
      # The suite's setup deploys the contracts, writes MPC_ROOT_KEY and the
      # signet and responder addresses to .env, and starts the fakenet
      # responder. Anvil is the EVM chain the flow files and the responder
      # share: the setup deploys the EVM target and funds the derived sender
      # there.
      - name: Integration suite (generic signet-caller e2e)
        env:
          TRUST_PREBUILT_ZK_KEYS: "1"
        run: yarn test:integration-tests
      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose --profile fakenet logs --no-color > ci-logs/compose.log 2>&1 || true
          docker ps -a > ci-logs/docker-ps.txt 2>&1 || true
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: ci-logs/
