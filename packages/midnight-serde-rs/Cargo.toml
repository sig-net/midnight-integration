[package]
name = "signet-midnight-serde"
version = "0.24.0-rc.9"
edition = "2024"
description = "Native Borsh serialisation with optional zero padding for Midnight callers."
repository = "https://github.com/sig-net/midnight-integration"
license = "MIT"
exclude = ["tests/"]

[workspace]

[dependencies]
borsh = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"
