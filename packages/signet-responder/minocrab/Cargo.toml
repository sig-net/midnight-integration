[package]
name = "signet-responder-zk"
version = "0.27.0-rc.2"
edition = "2024"
description = "The signet responder's circuits in MinoCrab, and the zk bundle compiled from them."
repository = "https://github.com/sig-net/midnight-integration"
license = "MIT"
publish = false

[workspace]

# The `midnight-*` crates are the crates.io versions midnight-node 2.1.101
# locks, the same ones minocrab resolves at the pinned rev. Cargo.lock holds
# each of them, the proving line included, at the version minocrab's own lock
# holds at that rev, which is what its gates ran against; a broad
# `cargo update` moves them.
[dependencies]
anyhow = "1.0.100"
midnight-base-crypto = "1.1.1"
midnight-coin-structure = "3.0.1"
midnight-ledger = { version = "1.0.1", package = "midnight-ledger-v9" }
midnight-storage = "3.0.0"
midnight-transient-crypto = "3.0.1"
midnight-zkir-v3 = { version = "=3.2.0", package = "midnight-zkir" }
minocrab = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
minocrab-ledger = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
minocrab-publisher = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
minocrab-sim = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409", features = ["unstable"] }
minocrab-std = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
minocrab-zkir = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signet-protocol = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }
signet-signer-interface = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }

[lints.clippy]
# A circuit's `Discloses<(A, B, …)>` return type is its disclosure
# declaration, one label per published value, so it is as long as the
# circuit's disclosures.
type_complexity = "allow"

[profile.dev.package."*"]
# The field arithmetic lives in the dependencies; optimise them once so the
# parity simulation and the keygen driver run fast in the dev profile.
opt-level = 3
